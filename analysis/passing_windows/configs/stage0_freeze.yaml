# ---------------------------------------------------------------------------
# Thesis
# ---------------------------------------------------------------------------
thesis: >
  Basketball possessions are sequences of disappearing passing windows.
  At each moment, the ball-handler has a changing set of receiver options with
  distinct delivery risk and post-catch value; these options can be measured
  from tracking, have finite lifetimes, and contain predictive information
  beyond ordinary ball, clock, and spacing features.

claims_allowed:
  - Passing opportunities vary materially within a touch rather than being static properties of court location.
  - Passability and post-catch value are distinct dimensions.
  - High-value windows have measurable lifetimes and are sometimes used before peak, near peak, after peak, or not used.
  - The quality and breadth of the live option set improve held-out prediction of near-term offensive outcomes.

claims_forbidden:
  - A modeled alternative pass would causally have produced more points.
  - An unused modeled option proves a player made a mistake.
  - Ten games support stable player or team rankings.
  - A single scalar represents the universally correct pass.
  - Language such as "correct pass", "bad decision", or "points left on the table".

article_language_required:
  - model-preferred
  - available under the model
  - unused

