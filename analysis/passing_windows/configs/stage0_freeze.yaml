  promote_exploratory_to_headline_only_if: stable_across_games_and_robustness_specs

# ---------------------------------------------------------------------------
# Kill criteria
# ---------------------------------------------------------------------------
kill_criteria:
  - id: unresolved_failed_targets
    rule: unresolved failed-pass targets exceed 10% OR audit reliability is poor
  - id: tracking_eligibility_loss
    rule: more than 20% of otherwise eligible decision states fail tracking criteria
  - id: completion_calibration
    rule: completion calibration slope outside roughly 0.75–1.25 OR reliability visibly poor
  - id: counterfactual_support
    rule: over 10% of evaluated counterfactuals lie outside training support
  - id: window_label_instability
    rule: window labels change by more than 15% under plausible tracking perturbations
  - id: predictive_improvement
    rule: >
      predictive improvement fails in at least 7 of 10 held-out games
      (central claim requires full option set beats state baseline in >= 7/10
      and exceeds matched nulls)
  - id: null_comparable
    rule: result is comparable to time-shifted/permuted nulls
  - id: single_game_driver
    rule: one game drives the headline OR tracking-quality restrictions reverse it

