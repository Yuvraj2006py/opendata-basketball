# ---------------------------------------------------------------------------
# TBD_TRAINING_FOLD registry (selection procedures locked; values not)
# ---------------------------------------------------------------------------
tbd_training_fold:
  - name: window_open_threshold
    procedure: Calibrate inside each outer-fold training set from decision/calibration curve; apply to held-out game only.
  - name: window_close_threshold
    procedure: Choose separately from open threshold for hysteresis; fold-internal only.
  - name: window_threshold_robustness_grid
    procedure: Prespecify grid after seeing training-fold calibration support; apply identically to all folds for specification curve.
  - name: failed_pass_auto_accept_geometric_margin
    procedure: Maximize training-fold audit agreement subject to unresolved-rate observability; freeze before headline scoring.
  - name: tracking_predError_caps
    procedure: Choose to keep eligible-state tracking failure rate under 20% kill line; document per fold.
  - name: pass_distance_support_rejection
    procedure: Reject candidates beyond attempted-pass distance support in that training fold.
  - name: imbalance_loss_weights
    procedure: Compute only inside training folds for passability model.
  - name: late_use_material_loss_delta
    procedure: Predeclare from training-fold NOV distribution quantiles before labeling late use on held-out games.
