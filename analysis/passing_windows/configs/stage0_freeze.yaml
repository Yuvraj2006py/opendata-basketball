# ---------------------------------------------------------------------------
# Populations
# ---------------------------------------------------------------------------
populations:
  primary:
    id: primary_live_frontcourt_nontransition
    description: >
      Live, frontcourt, non-transition touches in chances with usable==true
      and all ten players present.
    requirements:
      chance_usable: true            # qualityIndex >= 3
      chance_transition: false
      live_clock: true               # gameClockStopped == false at modeled frames
      frontcourt: true               # frameIdx >= chance.frontcourtFrame; ball/handler in frontcourt
      ten_players_tracked: true      # 5 home + 5 away with identifiable ball-handler
      unit: chance                   # not full possession
      exclude_inbounds: true
      exclude_substitution_boundary: true
    secondary_note: Confirmatory analyses use this population unless marked exploratory.

  secondary:
    - id: transition
      description: Same as primary but chance.transition == true
      role: sensitivity_and_context
    - id: lower_quality_tracking
      description: Include usable==false and/or higher predError strata
      role: robustness
    - id: inbounds
      description: Passes/touches with passes.inbounds == true
      role: sensitivity_exclude_from_primary
    - id: full_possession
      description: Analysis unit = possession rather than chance
      role: sensitivity

# ---------------------------------------------------------------------------
# Temporal sampling
# ---------------------------------------------------------------------------
temporal_sampling:
  model_hz: 5
  render_hz: 25
  model_frame_stride: 5   # every 5th 25 Hz frame
  velocity_causality: past_and_current_only
  smoothing_causality: no_future_frames

# ---------------------------------------------------------------------------
# Outcomes and baselines
# ---------------------------------------------------------------------------
outcomes:
  primary:
    - id: next_3s_offensive_points
      definition: >
        Expected offensive points scored in the next 3 seconds of the same chance,
        reconstructed from shots and free_throws (never from chances.ptsScored).
  secondary:
    - id: open_or_lightly_contested_shot_within_3s
    - id: any_shot_within_3s
    - id: paint_touch_within_3s
    - id: terminal_chance_points
      role: longer_horizon_sensitivity
    - id: observed_shotQuality
      role: validation_target_only_when_shot_occurs
      forbidden_as_contemporaneous_feature: true

baselines:
  predictive_ladder:
    - ball_handler_location_shot_clock_transition_score_passer_pressure_defender_distances_spacing
    - plus_ordinary_realized_action_features
    - plus_static_candidate_geometry
    - plus_passability_summaries
    - plus_full_option_set_window_summaries
  passability_ablation:
    - distance_only
    - nearest_defender_distance
    - static_lane_geometry_no_velocity
    - kinematic_geometry_no_uncertainty
    - full_model

# ---------------------------------------------------------------------------
# Core scores (exact formulas)
# ---------------------------------------------------------------------------
scores:
  passability:
    symbol: q
    formula: "q(j,t) = P(pass reaches candidate j | release-time state)"
  catch_value:
    symbol: V_catch
    definition: Predictive value at projected catch using only information available at catch projection time
  fail_value:
    symbol: V_fail
    primary: 0
    note: Optional possession-cost sensitivity analysis; do not invent opponent transition value from this sample
  keep_value:
    symbol: V_keep
    formula: "V_keep(t) = predictive value of continuing the current touch from current/past state (matched no-pass states)"
  option_value:
    symbol: Q
    formula: "Q(j,t) = q(j,t) * V_catch(j,t) + [1 - q(j,t)] * V_fail(t)"
  net_option_value:
    symbol: NOV
    formula: "NOV(j,t) = Q(j,t) - V_keep(t)"
  presentation_rule: >
    Do not collapse the article immediately to NOV; show passability and catch
    value separately before combining them.

# ---------------------------------------------------------------------------
# Window persistence / hysteresis
# ---------------------------------------------------------------------------
windows:
  min_persistence_seconds: 0.20
  min_persistence_frames_at_25hz: 5
  hysteresis:
    open_threshold: TBD_TRAINING_FOLD
    close_threshold: TBD_TRAINING_FOLD
    rule: >
      Separate opening and closing thresholds to prevent one-frame flicker.
      Select thresholds from calibration/decision considerations inside each
      training fold only; then repeat headline findings across a prespecified
      threshold grid.
  open_label_rule: >
    Open if passability exceeds the fold-calibrated open threshold AND NOV > 0,
    with persistence >= 0.20s.
  labels:
    - open
    - used
    - late
    - unused
    - never_open
  continuous_outputs:
    - opening_time
    - peak_time
    - closing_time
    - duration
    - peak_NOV
    - integrated_NOV
    - delay_opening_or_peak_to_release
    - value_at_use_vs_peak
    - window_existence_probability_under_tracking_perturbation
  threshold_grid_policy: >
    After fold-internal selection of primary open/close thresholds, re-run all
    headline findings on a fixed grid documented at Stage 5 freeze time.
    Grid values themselves remain TBD_TRAINING_FOLD until Stage 4/5.

# ---------------------------------------------------------------------------
# Exclusions and failed-pass target inference
# ---------------------------------------------------------------------------
exclusions:
  always_exclude_or_flag:
    - self_passes  # passerId == receiverId (~91 in 10 games)
    - malformed_chance_frame_order  # endFrame < startFrame (~3)
    - zero_elapsed_game_clock_chances  # audit/flag (~21)
    - chances_ptsScored_as_team_score_or_outcome_source  # unreliable; use shots+free_throws
    - toReceiverId_as_intended_receiver  # interceptor, never target
    - season_aggregate_csv_as_contemporaneous_covariate
  primary_population_excludes:
    - usable_false
    - transition_true
    - dead_clock_frames
    - backcourt_pre_frontcourtFrame
    - fewer_than_ten_tracked_players
    - inbounds_passes
    - substitution_boundaries
    - tracking_errors_above_predeclared_limits  # limits TBD_TRAINING_FOLD
  multi_pass_touches:
    count_in_10_games: 6
    policy: audit_and_deterministically_split_or_exclude
  tracking_error_caps:
    passer_predError_max: TBD_TRAINING_FOLD
    receiver_predError_max: TBD_TRAINING_FOLD
    lane_defender_predError_max: TBD_TRAINING_FOLD
    selection_procedure: >
      Choose caps inside training folds to keep eligible decision-state loss
      under kill criterion (<20% fail tracking); document chosen caps per fold.

failed_pass_target_inference:
  never_use_toReceiverId_as_target: true
  method: >
    At release, form four teammate candidates; compare position/projected
    movement to receiverLoc, ball trajectory when usable, pass direction, and
    empirical flight-time support; produce a probability distribution.
  auto_accept_margin: TBD_TRAINING_FOLD
  auto_accept_margin_selection: >
    Geometric margin over runner-up chosen inside training folds to maximize
    audit agreement while keeping unresolved rate measurable; freeze chosen
    margin before outer-fold scoring of headlines.
  unresolved_kill_threshold_pct: 10
  on_inadequate_reliability: >
    Retain failed passes only for touch-level turnover modeling; restrict
    receiver-specific completion calibration to outcomes with reliable targets.
  # Stage 2 amendment (2026-09-24). No frozen value above is changed; this
